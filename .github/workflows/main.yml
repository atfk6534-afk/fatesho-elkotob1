name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fetshou El Kotob APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file was found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Project extracted successfully."

      - name: Locate Flutter project
        id: locate_project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Flutter project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p android

          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Flutter pub get
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter pub get

      # IMPORTANT:
      # Automatically format the project instead of failing
      # when Dart files need formatting.
      - name: Format Dart code
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: dart format lib test

      - name: Verify Dart formatting
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter analyze

      - name: Flutter tests
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Prepare APK artifact
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" fetshou-el-kotob-release.apk

          ls -lh fetshou-el-kotob-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetshou-el-kotob-release-apk
          path: ${{ steps.locate_project.outputs.project_dir }}/fetshou-el-kotob-release.apk
          if-no-files-found: error
          retention-days: 30
